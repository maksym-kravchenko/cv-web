apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cv-app
  namespace: cv-app
  # No cert-manager. TLS uses the Cloudflare Origin CA certificate for
  # *.kravix.ch in the secret origin-tls (kravix-web/k8s/traefik/MIGRATION.md,
  # phase 1). Only Cloudflare trusts it, browsers don't, so the DNS record
  # must stay proxied (orange cloud).
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cv.kravix.ch
      secretName: origin-tls
  rules:
    - host: cv.kravix.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cv-app
                port:
                  name: http